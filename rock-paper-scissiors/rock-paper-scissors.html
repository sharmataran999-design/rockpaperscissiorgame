
<!DOCTYPE html>
<html>
<head>
<title>Rock Paper Scissors</title>

<style>
body{
background-color: rgba(25, 25, 25,1);
  color :white;
  font-family: Arial;
  }

.title{
  font-size:30px;
  font-weight: 600;
}
.move-icon{
  width:50px;

}

.move-button{
  background-color: transparent;
  border-radius: 50%;
  width:100px;
  height: 100px;
  border:solid 3px white;
  margin-right: 10px;
  cursor:pointer;
}

.js-result{
  font: bold 25px Arial;
  margin-top:50px;
   }
.js-score{
    margin-top:20px;
  }
.reset-score-button,.Auto-play-button{
    background-color: white;
    border: none;
    font-size: 15px;
    padding: 8px 15px;
    cursor: pointer;
}
</style>
  </head>
  <body>
<p class="title">Rock Paper Scissors</p>
 <button class="move-button js-rock">
    <img class="move-icon"src="emogies/rock-emoji.png">
    </button>

 <button class="move-button js-paper">
 <img class="move-icon" src="emogies/paper-emoji.png">
</button>

  <button class="move-button">
    <img class="move-icon js-scissors" src="emogies/scissors-emoji.png">
  </button>

<p class="js-result"></p>
<p class="js-moves">
</p>
<p class= "js-score"></p>
<p class="js-reset-confirmation"></p>

    <button class="reset-score-button" >Reset Score</button>
<button class="Auto-play-button" >
  Auto Play</button>
   <script>
      let score = JSON.parse(localStorage.getItem('score')) || {
        wins: 0,
        losses: 0,
        ties: 0
      };
updatescoreelement()
       
 function playGame(playerMove) {
    const computerMove = pickComputerMove();

    let result = '';

    if (playerMove === 'scissors') {
    if (computerMove === 'rock') {
            result = 'You lose.';
    } 
     else if (computerMove === 'paper') {
        result = 'You win.';
    }
     else if (computerMove === 'scissors') {
        result = 'Tie.';
    }
    }
     else if (playerMove === 'paper') {
          if (computerMove === 'rock') {
            result = 'You win.';
          } else if (computerMove === 'paper') {
            result = 'Tie.';
          } else if (computerMove === 'scissors') {
            result = 'You lose.';
          }
          
        } else if (playerMove === 'rock') {
          if (computerMove === 'rock') {
            result = 'Tie.';
          } else if (computerMove === 'paper') {
            result = 'You lose.';
          } else if (computerMove === 'scissors') {
            result = 'You win.';
         }
       }

      if (result === 'You win.') {
        score.wins += 1;
      } else if (result === 'You lose.') {
        score.losses += 1;        
      } else if (result === 'Tie.') {
          score.ties += 1;
      } 


    updatescoreelement()
      localStorage.setItem('score', JSON.stringify(score));

      document.querySelector('.js-result')
       .innerHTML= result;
    
   document.querySelector('.js-moves')
   .innerHTML=
     `You 
  <img src="emogies/${playerMove}-emoji.png" class="move-icon">
  <img src="emogies/${computerMove}-emoji.png" class="move-icon"> 
  Computer `;
      }

    
   
    function updatescoreelement(){
       document.querySelector('.js-score')
        .innerHTML=
        `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`
    }
    function pickComputerMove() {
        const randomNumber = Math.random();

        let computerMove = '';

        if (randomNumber >= 0 && randomNumber < 1 / 3) {
          computerMove = 'rock';
        } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
          computerMove = 'paper';
        } else if (randomNumber >= 2 / 3 && randomNumber < 1) {
          computerMove = 'scissors';
        }

        return computerMove;
    }
    
  let intervalId;
  let isAutoPlaying = false;

function autoplay() {
  if (!isAutoPlaying) {
    intervalId = setInterval(()=> {
      const playerMove = pickComputerMove();
      playGame(playerMove);
    }, 1000);
    document.querySelector('.Auto-play-button')
    .innerHTML='Playing'

    isAutoPlaying = true;  // Inside if block
  } else {
    clearInterval(intervalId);
    isAutoPlaying = false;
      document.querySelector('.Auto-play-button')
    .innerHTML='Auto Play'
  }
}

document.querySelector('.js-rock')
.addEventListener('click',()=>{
  playGame('rock')
});

document.querySelector('.js-paper')
.addEventListener('click',()=>{
  playGame('paper')
});

document.querySelector('.js-scissors')
.addEventListener('click',()=>{
  playGame('scissors')
});

document.querySelector(' .reset-score-button')
.addEventListener('click',()=>{
   showResetConfirmation();
  }
);

document.querySelector('.Auto-play-button')
.addEventListener('click',()=>{
  autoplay()
  }
);




document.body
.addEventListener('keydown',(event)=>{
  if (event.key==='r'){
    playGame('rock')
  }
   else if (event.key==='p'){
    playGame('paper')
  }
  else if (event.key==='s'){
    playGame('scissors')

  }
   else if (event.key==='a'){
    autoplay();
   }
else if(event.key==='Backspace'){
  showResetConfirmation();

    ;
  }
});
function showResetConfirmation() {
  document.querySelector('.js-reset-confirmation')
    .innerHTML = `
      Are you sure you want to reset the score?
      <button class="js-reset-confirm-yes reset-confirm-button">
        Yes
      </button>
      <button class="js-reset-confirm-no reset-confirm-button">
        No
      </button>
    
    `;
     document.querySelector('.js-reset-confirm-yes')
    .addEventListener('click', () => {
      resetScore();
      hideResetConfirmation();
    });
  
  document.querySelector('.js-reset-confirm-no')
    .addEventListener('click', () => {
      hideResetConfirmation();
    });
}
function hideResetConfirmation() {
  document.querySelector('.js-reset-confirmation')
    .innerHTML = '';
}

function resetScore() {
  score = {wins: 0, losses: 0, ties: 0};
  localStorage.removeItem('score');
  updatescoreelement();
}

    </script>
  </body>
</html>
